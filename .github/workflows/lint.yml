name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Check TOML validity
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          python -c "import tomllib; tomllib.load(open('.tombi.toml', 'rb'))"
          python -c "import tomllib; tomllib.load(open('prek.toml', 'rb'))"
          python -c "import tomllib; tomllib.load(open('typos.toml', 'rb'))"
