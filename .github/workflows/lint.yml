name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Check TOML validity
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          python -c "import tomllib; tomllib.load(open('.tombi.toml', 'rb'))"
          python -c "import tomllib; tomllib.load(open('prek.toml', 'rb'))"
          python -c "import tomllib; tomllib.load(open('typos.toml', 'rb'))"
