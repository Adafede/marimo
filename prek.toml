# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-added-large-files" }, { id = "check-ast" }, { id = "check-builtin-literals" }, { id = "check-case-conflict" }, { id = "check-docstring-first" }, { id = "check-illegal-windows-names" }, { id = "check-merge-conflict" }, { id = "check-symlinks" }, { id = "check-toml" }, { id = "check-json" }, { id = "check-vcs-permalinks" }, { id = "debug-statements" }, { id = "destroyed-symlinks" }, { id = "detect-private-key" }, { id = "end-of-file-fixer", exclude = "^apps/public/" }, { id = "fix-byte-order-marker" }, { id = "mixed-line-ending" }, { id = "trailing-whitespace" }]

[[repos]]
repo = "https://github.com/fpgmaas/deptry"
rev = "0.25.1"
hooks = [{ id = "deptry", language = "python", additional_dependencies = ["deptry"], exclude = '^(?!.*\.py$).*$' }]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.39.0"
hooks = [{ id = "check-github-workflows" }, { id = "check-taskfile" }]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.22.0"
hooks = [{ id = "pyupgrade" }]

[[repos]]
repo = "https://github.com/asottile/add-trailing-comma"
rev = "v4.0.0"
hooks = [{ id = "add-trailing-comma" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.8"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos", exclude = "^apps/public/" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.6"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "local"
hooks = [{ id = "ty-check", name = "ty-check", language = "python", entry = "ty check --config-file ty.toml", exclude = '^(?!.*\.py$).*$', additional_dependencies = ["ty"] }, { id = "graphify-regen", name = "graphify-regen", language = "system", entry = "graphify extract . --code-only --no-cluster --out .", pass_filenames = false, always_run = true }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.31.1"
hooks = [{ id = "zizmor", entry = "zizmor --fix=all ." }]

[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.17.1"
hooks = [{ id = "panache-format" }, { id = "panache-lint" }]

[[repos]]
repo = "https://github.com/adafede/pre-commit-uv-pep723-upgrade"
rev = "v0.0.1"
hooks = [{ id = "uv-pep723-upgrade" }]
