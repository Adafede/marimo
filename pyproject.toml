[project]
name = "adafedemarimo"
version = "0.1.0"
description = "Minimal, reusable utilities for marimo applications"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.14.5",
  "altair>=6.3.0",
  "cmcrameri>=1.10",
  "epam-indigo>=1.46.0",
  "fsspec>=2026.9.0",
  "maplib>=0.20.14",
  "marimo>=0.25.1",
  "matchms>=0.33.1",
  "networkx>=3.4.2",
  "numpy>=2.5.4",
  "polars>=2.0.0",
  "pyarrow>=26.0.0",
  "pydantic-ai>=2.57.0",
  "rdflib>=7.6.0",
  "rdkit>=2026.9.1",
  "requests>=2.34.2",
  "scipy>=1.16.3",
  "simple-parsing>=0.1.9",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
lotus_wikidata_explorer = "apps.lotus_wikidata_explorer:main"

[dependency-groups]
dev = [
  "pre-commit>=4.7.0",
]

[tool.deptry]
package_module_name_map = { "epam-indigo" = "indigo" }

# pyodide_http is provided by the Pyodide runtime; fire/jinja2/loguru are
# declared inline in build.py's PEP 723 script block.
[tool.deptry.per_rule_ignores]
DEP001 = ["pyodide_http", "fire", "jinja2", "loguru"]
# Imported lazily by altair/marimo at runtime (image export, remote IO).
DEP002 = [
  "aiohttp",
  "fsspec",
  "matchms",
  "pydantic-ai",
  "vegafusion",
  "vl-convert-python",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Marimo cells display the last expression intentionally
"notebooks/*.py" = ["B018", "B023", "BLE001", "LOG015", "S110", "S112"]
"notebooks/**/*.py" = ["B018", "B023", "BLE001", "LOG015", "S110", "S112"]
"apps/*.py" = ["B018", "BLE001", "DTZ005", "DTZ007", "DTZ011", "LOG015", "PLC0206", "S110", "S112"]
"apps/**/*.py" = ["B018", "BLE001", "DTZ005", "DTZ007", "DTZ011", "LOG015", "PLC0206", "S110", "S112"]
# Module code may use broad exception handling
"modules/**/*.py" = ["BLE001", "S110", "S112"]
# Build scripts catch broad exceptions to report and continue
"build.py" = ["BLE001"]
".github/scripts/*.py" = ["BLE001"]

[tool.setuptools.packages.find]
