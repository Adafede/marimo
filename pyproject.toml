[project]
name = "adafedemarimo"
version = "0.1.0"
description = "Minimal, reusable utilities for marimo applications"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.14.3",
  "altair>=6.3.0",
  "cmcrameri>=1.10",
  "epam-indigo>=1.46.0",
  "fsspec>=2026.9.0",
  "maplib>=0.20.14",
  "marimo>=0.25.0",
  "matchms>=0.33.1",
  "networkx>=3.4.2",
  "numpy>=2.5.3",
  "polars>=1.44.2",
  "pyarrow>=25.0.1",
  "pydantic-ai>=2.51.0",
  "rdflib>=7.6.0",
  "rdkit>=2026.3.6",
  "requests>=2.34.2",
  "scipy>=1.16.3",
  "simple-parsing>=0.1.9",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
lotus_wikidata_explorer = "apps.lotus_wikidata_explorer:main"

[dependency-groups]
  dev = [
    "pre-commit>=4.6.2",
  ]

[tool.deptry]
package_module_name_map = { "epam-indigo" = "indigo" }

[tool.setuptools.packages.find]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Marimo cells display the last expression intentionally
"notebooks/*" = ["B018"]
"apps/*" = ["B018", "BLE001"]
# Module code may use broad exception handling
"modules/*" = ["BLE001"]
